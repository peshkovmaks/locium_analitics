version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mp_user
      POSTGRES_PASSWORD: mp_password
      POSTGRES_DB: marketplace_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mp_user -d marketplace_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://mp_user:mp_password@db:5432/marketplace_analytics
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://mp_user:mp_password@db:5432/marketplace_analytics
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app
    depends_on:
      - db
      - redis
    command: celery -A app.celery_app worker --loglevel=info

  celery_beat:
    build: .
    user: "1000:1000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://mp_user:mp_password@db:5432/marketplace_analytics
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app
    depends_on:
      - db
      - redis
    command: celery -A app.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
